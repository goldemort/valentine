<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations! 🎉</title>
    <style>
        body {
            background: #ff99cc;
            font-family: 'Comic Sans MS', cursive;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #ec00b8;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        p {
            font-size: 1.5em;
            color: #333;
        }
        .celebrate {
            font-size: 60px;
            margin: 20px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(30);
                opacity: 0;
            }
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes shoot {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(var(--dy)) translateX(var(--dx));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="celebrate">🎉💖🎉</div>
        <h1>Congratulations! You are my Valentine😨😨😨</h1>
        <p>You are invited to Tulsi Restaurant at 7:30, this Friday!</p>
        <p>Dress accordingly! 👗</p>
        <div class="celebrate">🎶🍷🍴</div>
    </div>

    <script>
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createFirework(x, y) {
            const colors = ['#ff0000', '#ffd700', '#ff69b4', '#00ff00', '#ff4500', '#4169e1'];
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(firework);

            // Create explosion particles
            const particleCount = 50; // Increased particles for more effect
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (i * 360) / particleCount;
                const velocity = random(100, 200); // Increased velocity for more spread
                const dx = velocity * Math.cos(angle * Math.PI / 180);
                const dy = velocity * Math.sin(angle * Math.PI / 180);
                
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                
                particle.style.animation = 'shoot 1.5s forwards'; // Slightly longer animation
                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 1500);
            }

            firework.style.animation = 'explode 0.5s forwards';
            setTimeout(() => firework.remove(), 500);
        }

        function launchRandomFirework() {
            const x = random(0, window.innerWidth);
            const y = random(0, window.innerHeight * 0.7);
            createFirework(x, y);
        }

        // Launch fireworks more frequently
        const fireworkInterval = setInterval(launchRandomFirework, 200); // Fireworks every 200ms

        // Launch a burst of fireworks initially
        for (let i = 0; i < 20; i++) {
            setTimeout(() => launchRandomFirework(), i * 100);
        }

        // Launch fireworks on click
        document.addEventListener('click', (e) => {
            // Launch multiple fireworks on each click
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        e.clientX + random(-50, 50),
                        e.clientY + random(-50, 50)
                    );
                }, i * 100);
            }
        });

        // Stop fireworks after 30 seconds (optional)
        setTimeout(() => clearInterval(fireworkInterval), 30000);
    </script>
</body>
</html>
