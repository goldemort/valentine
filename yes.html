<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations! 🎉</title>
    <style>
        body {
            background: #ff99cc;
            font-family: 'Comic Sans MS', cursive;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.5em;
            color: #333;
        }

        .celebrate {
            font-size: 60px;
            margin: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="celebrate">🎉💖🎉</div>
        <h1>Congratulations!</h1>
        <p>You are invited to Tulsi Restaurant at 7:30</p>
        <p>Dress accordingly! 👗</p>
        
        <div class="celebrate">🎶🍷🍴</div>
    </div>
</body>
</html>
