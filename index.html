<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        /* ... (keep existing styles) ... */

        /* New style for mocking messages */
        .mock-message {
            position: absolute;
            color: #ff4444;
            font-size: 1.2em;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            animation: fadeOut 2s forwards;
            text-shadow: 1px 1px white;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="container">
        <h1>💖 Will You Be My Valentine? 💖</h1>
        <button id="yesButton" onclick="accept()">YES!</button>
        <button id="noButton" onmouseover="moveButton()" onclick="growYes()">NO</button>
    </div>

    <script>
        let scale = 1;
        const mockMessages = [
            "Too slow! 🐢",
            "Not fast enough! 🐌",
            "Nope! 😜",
            "Missed me! 😎",
            "Try harder! 💪",
            "Almost! 😅",
            "Nuh-uh! 🙅♂️",
            "Swiper, no swiping! 🦊",
            "Catch me if you can! 🏃♂️",
            "Psych! 🤪"
        ];

        function createMockMessage() {
            const message = document.createElement('div');
            message.className = 'mock-message';
            
            // Position near the button
            const buttonRect = document.getElementById('noButton').getBoundingClientRect();
            message.style.left = `${buttonRect.left + Math.random() * 50 - 25}px`;
            message.style.top = `${buttonRect.top - 30}px`;
            
            message.textContent = mockMessages[Math.floor(Math.random() * mockMessages.length)];
            document.body.appendChild(message);
            
            // Remove element after animation
            setTimeout(() => message.remove(), 2000);
        }

        function growYes() {
            scale += 0.3;
            document.getElementById('yesButton').style.transform = `scale(${scale})`;
            createHearts(5);
        }

        function moveButton() {
            const button = document.getElementById('noButton');
            button.style.position = 'absolute';
            button.style.left = Math.random() * 80 + '%';
            button.style.top = Math.random() * 80 + '%';
            
            // Create mocking message
            createMockMessage();
        }

        function accept() {
            window.location.href = 'yes.html';
        }

        function createHearts(count) {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.innerHTML = '💖';
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 3000);
            }
        }
    </script>
</body>
</html>
