<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        /* Previous styles remain the same until mock-message */
        body {
            background: linear-gradient(135deg, #ff3377, #cc0044);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(13, 31, 45, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff99cc;
            font-size: 2.5em;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
            text-shadow: 0 0 10px rgba(255, 153, 204, 0.5);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #yesButton {
            font-size: 24px;
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #yesButton:hover {
            background: #45a049;
            transform: scale(1.1);
        }

        #noButton {
            font-size: 24px;
            padding: 15px 30px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #noButton:hover {
            background: #e53935;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .heart {
            position: absolute;
            color: #ff0066;
            font-size: 20px;
            animation: float 5s infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        /* Updated mock-message styles for maximum visibility */
        .mock-message {
            position: absolute;
            background-color: #000000;
            color: #c060db;
            font-size: 1.8em;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            animation: fadeOut 2s forwards;
            padding: 10px 20px;
            border-radius: 10px;
            border: 3px solid #c060db;
            box-shadow: 0 0 10px #c060db,
                       0 0 20px rgba(0, 255, 0, 0.5);
            z-index: 1000;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50px) scale(1.1); }
        }

        .background-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .background-hearts div {
            position: absolute;
            color: #ff0066;
            font-size: 30px;
            animation: floatBackground 10s infinite;
            opacity: 0;
        }

        @keyframes floatBackground {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    <div class="background-hearts">
        <div style="left: 10%; animation-delay: 0s;">💖</div>
        <div style="left: 30%; animation-delay: 2s;">💖</div>
        <div style="left: 50%; animation-delay: 4s;">💖</div>
        <div style="left: 70%; animation-delay: 6s;">💖</div>
        <div style="left: 90%; animation-delay: 8s;">💖</div>
    </div>
    
    <div class="container">
        <h1>💖 Will You Be My Valentine? 💖</h1>
        <button id="yesButton" onclick="accept()">YES!</button>
        <button id="noButton" onmouseover="moveButton()" onclick="growYes()">NO</button>
    </div>

    <script>
        let scale = 1;
        const mockMessages = [
            "Too slow! 🐢",
            "Not fast enough! 🐌",
            "Nope! 😜",
            "Missed me! 😎",
            "Try harder! 💪",
            "Almost! 😅",
            "Nuh-uh! 🙅♂️",
            "Swiper, no swiping! 🦊",
            "Catch me if you can! 🏃♂️",
            "Psych! 🤪"
        ];

        function createMockMessage() {
            const message = document.createElement('div');
            message.className = 'mock-message';
            
            // Position near the button
            const buttonRect = document.getElementById('noButton').getBoundingClientRect();
            message.style.left = `${buttonRect.left + Math.random() * 50 - 25}px`;
            message.style.top = `${buttonRect.top - 30}px`;
            
            message.textContent = mockMessages[Math.floor(Math.random() * mockMessages.length)];
            document.body.appendChild(message);
            
            // Remove element after animation
            setTimeout(() => message.remove(), 2000);
        }

        function growYes() {
            scale += 0.3;
            document.getElementById('yesButton').style.transform = `scale(${scale})`;
            createHearts(5);
        }

        function moveButton() {
            const button = document.getElementById('noButton');
            button.style.position = 'absolute';
            button.style.left = Math.random() * 80 + '%';
            button.style.top = Math.random() * 80 + '%';
            
            // Create mocking message
            createMockMessage();
        }

        function accept() {
            window.location.href = 'yes.html';
        }

        function createHearts(count) {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.innerHTML = '💖';
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 3000);
            }
        }
    </script>
</body>
</html>
