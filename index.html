<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background: #ff99cc;
            font-family: 'Comic Sans MS', cursive;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #ff0066;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        #yesButton {
            font-size: 24px;
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }

        #noButton {
            font-size: 24px;
            padding: 15px 30px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
            position: relative;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .heart {
            position: absolute;
            color: #ff0066;
            font-size: 20px;
            animation: float 3s infinite;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="container">
        <h1>💖 Will You Be My Valentine? 💖</h1>
        <button id="yesButton" onclick="accept()">YES!</button>
        <button id="noButton" onmouseover="moveButton()" onclick="growYes()">NO</button>
    </div>

    <script>
        let scale = 1;
        
        function growYes() {
            scale += 0.3;
            document.getElementById('yesButton').style.transform = `scale(${scale})`;
            createHearts(5);
        }

        function moveButton() {
            const button = document.getElementById('noButton');
            button.style.position = 'absolute';
            button.style.left = Math.random() * 80 + '%';
            button.style.top = Math.random() * 80 + '%';
        }

        function accept() {
            window.location.href = 'yes.html';
        }

        function createHearts(count) {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.innerHTML = '💖';
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 3000);
            }
        }
    </script>
</body>
</html>
